<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Galeria de imagens com carregamento sob demanda.">
  <title>Galeria de Imagens com Lazy Loading</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #17212b;
      background: #f4f6f8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 2rem 1rem 1rem; text-align: center; }
    h1 { margin: 0 0 0.75rem; }
    .intro { max-width: 48rem; margin: 0 auto; line-height: 1.6; }
    main { width: min(100% - 2rem, 72rem); margin: 0 auto 3rem; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr));
      gap: 1.25rem;
    }
    figure {
      margin: 0;
      overflow: hidden;
      border-radius: 0.75rem;
      background: #e1e7ed;
      box-shadow: 0 0.25rem 1rem rgb(20 35 50 / 10%);
    }
    figure img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      opacity: 0;
      transition: opacity 500ms ease-in-out;
    }
    figure img.loaded { opacity: 1; }
    figure img.error { opacity: 0.5; }
    figcaption { padding: 0.75rem 1rem 0.25rem; font-weight: 700; }
    .status {
      min-height: 2.5rem;
      padding: 0.35rem 1rem 0.8rem;
      color: #455563;
      font-size: 0.9rem;
    }
    footer { padding: 0 1rem 2rem; color: #455563; text-align: center; }
    @media (prefers-reduced-motion: reduce) {
      figure img { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Galeria de Imagens com Lazy Loading</h1>
    <p class="intro">
      Role a página para observar as imagens sendo solicitadas quando se
      aproximam da área visível. Depois de carregadas, elas aparecem com
      uma transição suave.
    </p>
  </header>
  <main>
    <section class="gallery" aria-label="Galeria de imagens">
      <figure>
        <img class="lazy" data-src="imagens/imagem1.jpg" alt="Primeira imagem da galeria" width="800" height="600">
        <figcaption>Imagem 1</figcaption>
        <p class="status" aria-live="polite">Aguardando carregamento.</p>
      </figure>
      <figure>
        <img class="lazy" data-src="imagens/imagem2.jpg" alt="Segunda imagem da galeria" width="800" height="600">
        <figcaption>Imagem 2</figcaption>
        <p class="status" aria-live="polite">Aguardando carregamento.</p>
      </figure>
      <figure>
        <img class="lazy" data-src="imagens/imagem3.jpg" alt="Terceira imagem da galeria" width="800" height="600">
        <figcaption>Imagem 3</figcaption>
        <p class="status" aria-live="polite">Aguardando carregamento.</p>
      </figure>
      <figure>
        <img class="lazy" data-src="imagens/imagem4.jpg" alt="Quarta imagem da galeria" width="800" height="600">
        <figcaption>Imagem 4</figcaption>
        <p class="status" aria-live="polite">Aguardando carregamento.</p>
      </figure>
      <figure>
        <img class="lazy" data-src="imagens/imagem5.jpg" alt="Quinta imagem da galeria" width="800" height="600">
        <figcaption>Imagem 5</figcaption>
        <p class="status" aria-live="polite">Aguardando carregamento.</p>
      </figure>
      <figure>
        <img class="lazy" data-src="imagens/imagem6.jpg" alt="Sexta imagem da galeria" width="800" height="600">
        <figcaption>Imagem 6</figcaption>
        <p class="status" aria-live="polite">Aguardando carregamento.</p>
      </figure>
    </section>
  </main>
  <footer>
    <p>Atividade prática de performance e otimização de aplicações web.</p>
  </footer>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const lazyImages = document.querySelectorAll(".lazy");

      function loadImage(img) {
        const status = img.closest("figure").querySelector(".status");
        const imageSource = img.dataset.src;

        if (!imageSource) {
          img.classList.add("error");
          status.textContent = "Não foi informado o caminho da imagem.";
          return;
        }

        img.addEventListener("load", () => {
          img.classList.add("loaded");
          status.textContent = "Imagem carregada.";
        }, { once: true });

        img.addEventListener("error", () => {
          img.classList.add("error");
          status.textContent =
            "Não foi possível carregar a imagem. Confira o nome, a extensão e a pasta.";
        }, { once: true });

        img.src = imageSource;
        delete img.dataset.src;
      }

      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver((entries, currentObserver) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            loadImage(entry.target);
            currentObserver.unobserve(entry.target);
          });
        }, {
          root: null,
          rootMargin: "200px 0px",
          threshold: 0.1
        });

        lazyImages.forEach((img) => observer.observe(img));
      } else {
        lazyImages.forEach(loadImage);
      }
    });
  </script>
</body>
</html>
